<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Library</title>
</head>
<body>
<h1>Add Library</h1>

<form th:action="@{/libraries}" th:object="${library}" method="post">
    ID: <input type="text" th:field="*{id}"/><br>
    Name: <input type="text" th:field="*{name}"/><br>
    <button type="submit">Add</button>
</form>

<a th:href="@{/libraries}">Back</a>
</body>
</html>
