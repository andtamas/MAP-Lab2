<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libraries</title>
</head>
<body>
<h1>Libraries</h1>

<p><a th:href="@{/libraries/new}">Add New Library</a></p>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
    </tr>

    <tr th:each="library : ${libraries}">
        <td th:text="${library.id}"></td>
        <td th:text="${library.name}"></td>
        <td>
            <form th:action="@{'/libraries/' + ${library.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
