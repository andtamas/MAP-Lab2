<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Magazines</title>
</head>
<body>
<h1>Magazines</h1>

<a href="/magazines/new">Add New Magazine</a>

<table border="1" cellpadding="4" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Publisher</th>
        <th>Action</th>
    </tr>

    <tr th:each="magazine : ${magazines}">
        <td th:text="${magazine.id}">ID</td>
        <td th:text="${magazine.title}">Title</td>
        <td th:text="${magazine.publisher}">Publisher</td>
        <td>
            <form th:action="@{'/magazines/' + ${magazine.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>

</table>

</body>
</html>
