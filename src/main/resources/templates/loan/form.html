<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${loan.id} != null ? 'Edit Loan' : 'Add Loan'"></title>
</head>
<body>
<h1 th:text="${loan.id} != null ? 'Edit Loan' : 'Add Loan'"></h1>

<form th:action="@{${loan.id} != null ? '/loans/' + ${loan.id} + '/update' : '/loans'}"
      th:object="${loan}" method="post">

    <label>ID: <input type="text" th:field="*{id}" th:readonly="${loan.id} != null"/></label><br>
    <label>Member ID: <input type="text" th:field="*{memberId}"/></label><br>
    <label>Date: <input type="text" th:field="*{date}"/></label><br>
    <button type="submit" th:text="${loan.id} != null ? 'Update' : 'Add'"></button>
</form>

<a href="/loans">Back</a>
</body>
</html>
