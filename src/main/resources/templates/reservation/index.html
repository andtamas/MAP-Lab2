<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
</head>
<body>
<h1>Reservations</h1>

<h2>Filter Reservations</h2>
<form th:action="@{/reservations}" method="get">
    <label for="status">Status:</label>
    <select id="status" name="status">
        <option value="">-- Select Status --</option>
        <option th:each="s : ${allStatuses}"
                th:value="${s}"
                th:text="${s}"
                th:selected="${s == filterStatus}"></option>
    </select>

    <label for="memberId">Member ID:</label>
    <input type="number" id="memberId" name="memberId" th:value="${filterMemberId}" placeholder="Enter Member ID"/>

    <button type="submit">Filter</button>
    <a th:href="@{/reservations}"><button type="button">Clear Filter</button></a>
</form>

<hr/>

<a th:href="@{/reservations/new}">Add New Reservation</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Member ID</th>
        <th>Readable Item ID</th>
        <th>Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="reservation : ${reservations}">
        <td th:text="${reservation.id}">ID</td>
        <td th:text="${reservation.memberId}">Member ID</td>
        <td th:text="${reservation.readableItemId}">Item ID</td>
        <td th:text="${reservation.date}">Date</td>
        <td th:text="${reservation.status}">Status</td>
        <td>
            <form th:action="@{'/reservations/' + ${reservation.id} + '/detail'}" method="get" style="display:inline;">
                <button type="submit">View</button>
            </form>

            <form th:action="@{'/reservations/' + ${reservation.id} + '/edit'}" method="get" style="display:inline;">
                <button type="submit">Edit</button>
            </form>

            <form th:action="@{|/reservations/${reservation.id}/delete|}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
