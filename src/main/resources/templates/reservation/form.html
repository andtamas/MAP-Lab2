<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Reservation</title>
</head>
<body>
<h1>Add Reservation</h1>

<form th:action="${#strings.isEmpty(reservation.id) ? '/reservations' : '/reservations/' + reservation.id + '/edit'}"
      th:object="${reservation}" method="post">
    <label>ID: <input type="text" th:field="*{id}" th:readonly="${reservation.id != null}" /></label><br>
    <label>Member ID: <input type="text" th:field="*{memberId}" /></label><br>
    <label>Readable Item ID: <input type="text" th:field="*{readableItemId}" /></label><br>
    <label>Date: <input type="text" th:field="*{date}" /></label><br>
    <label>Status:
        <select th:field="*{status}">
            <option th:each="s : ${T(com.example.Library.model.ReservationStatus).values()}"
                    th:value="${s}" th:text="${s}"></option>
        </select>
    </label><br>
    <button type="submit" th:text="${reservation.id == null ? 'Add' : 'Update'}"></button>
</form>

<a th:href="@{/reservations}">Back to list</a>
</body>
</html>
