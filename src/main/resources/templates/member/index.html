<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members</title>
</head>
<body>
<h1>Members</h1>

<h2>Filter Members</h2>
<form th:action="@{/members}" method="get">

    <label for="id">Member ID:</label>
    <input type="number" id="id" name="id" th:value="${filterId}" placeholder="Filter by ID"/>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" th:value="${filterName}" placeholder="Filter by Name"/>

    <label for="libraryId">Library:</label>
    <select id="libraryId" name="libraryId">
        <option value="">-- All Libraries --</option>
        <option th:each="library : ${allLibraries}"
                th:value="${library.id}"
                th:text="${library.name + ' (ID: ' + library.id + ')'}"
                th:selected="${library.id == filterLibraryId}"></option>
    </select>
    <br>

    <button type="submit">Filter</button>
    <a th:href="@{/members}"><button type="button">Clear Filters</button></a>
</form>

<hr/>

<a href="/members/new">Add New Member</a>

<table border="1" cellpadding="4" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Library ID</th>
        <th>Actions</th>
    </tr>

    <tr th:each="member : ${members}">
        <td th:text="${member.id}">ID</td>
        <td th:text="${member.name}">Name</td>
        <td th:text="${member.libraryId}">Library ID</td>
        <td>
            <form th:action="@{'/members/' + ${member.id} + '/detail'}" method="get" style="display:inline">
                <button type="submit">View</button>
            </form>
            <form th:action="@{'/members/' + ${member.id} + '/edit'}" method="get" style="display:inline">
                <button type="submit">Edit</button>
            </form>
            <form th:action="@{'/members/' + ${member.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>

</table>

</body>
</html>
