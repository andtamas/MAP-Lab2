<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Detail</title>
</head>
<body>
<h1 th:text="'Member Details - ID: ' + ${member.id}">Member Details</h1>

<p><strong>ID:</strong> <span th:text="${member.id}">1</span></p>
<p><strong>Name:</strong> <span th:text="${member.name}">John Doe</span></p>

<p><strong>Email:</strong> <span th:text="${member.email}">john.doe@example.com</span></p>

<p>
    <strong>Library ID:</strong>
    <span th:text="${member.libraryId}">1</span>
</p>

<hr>
<a th:href="@{/members/{id}/edit(id=${member.id})}">Edit Member</a> |
<a th:href="@{/members}">Back to List</a>
</body>
</html>
