<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <title>Add Readable Item</title>
</head>
<body>
<h1>Add Readable Item</h1>

<form th:action="@{/items}" th:object="${item}" method="post">
    ID: <input type="text" th:field="*{id}"/><br>
    Publication ID: <input type="text" th:field="*{publicationId}"/><br>
    Barcode: <input type="text" th:field="*{barcode}"/><br>
    Status: <input type="text" th:field="*{status}"/><br>
    <button type="submit">Add</button>
</form>

<a href="/items">Back</a>

</body>
</html>
