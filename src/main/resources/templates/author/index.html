<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
</head>
<body>
<h1>Authors</h1>

<h2>Filter Authors</h2>
<form th:action="@{/authors}" method="get">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" th:value="${filterName}" placeholder="Filter by Name"/>

    <button type="submit">Filter</button>
    <a th:href="@{/authors}"><button type="button">Clear Filters</button></a>
</form>

<hr/>

<a href="/authors/new">Add New Author</a>

<table border="1" cellpadding="4" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>

    <tr th:each="author : ${authors}">
        <td th:text="${author.id}">ID</td>
        <td th:text="${author.name}">Name</td>
        <td>
            <form th:action="@{'/authors/' + ${author.id} + '/detail'}" method="get" style="display:inline">
                <button type="submit">View</button>
            </form>
            <form th:action="@{'/authors/' + ${author.id} + '/edit'}" method="get" style="display:inline">
                <button type="submit">Edit</button>
            </form>
            <form th:action="@{'/authors/' + ${author.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>

</table>

</body>
</html>
