<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>
<h1>Add Book</h1>

<form th:action="@{/books}" th:object="${book}" method="post">
    ID: <input type="text" th:field="*{id}"/><br>
    Title: <input type="text" th:field="*{title}"/><br>
    <button type="submit">Add</button>
</form>

<a href="/books">Back</a>

</body>
</html>
