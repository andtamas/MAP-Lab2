<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>

<h1>Books</h1>
<a href="/books/new">Add New Book</a>

<table border="1" cellpadding="4" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Book Authors (IDs)</th>
        <th>Actions</th>
    </tr>

    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td>
            <span th:each="ba : ${book.bookAuthors}" th:text="${ba.authorId + ' '}"></span>
        </td>
        <td>
            <form th:action="@{'/books/' + ${book.id} + '/detail'}" method="get" style="display:inline">
                <button type="submit">View</button>
            </form>
            <form th:action="@{'/books/' + ${book.id} + '/edit'}" method="get" style="display:inline">
                <button type="submit">Edit</button>
            </form>
            <form th:action="@{'/books/' + ${book.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
