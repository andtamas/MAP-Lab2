<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add BookAuthor</title>
</head>
<body>
<h1>Add BookAuthor</h1>

<form th:action="@{/bookauthors}" th:object="${bookAuthor}" method="post">
    ID: <input type="text" th:field="*{id}"/><br>
    Book ID: <input type="text" th:field="*{bookId}"/><br>
    Author ID: <input type="text" th:field="*{authorId}"/><br>
    <button type="submit">Add</button>
</form>

<a href="/bookauthors">Back</a>

</body>
</html>
