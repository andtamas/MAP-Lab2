spring.application.name=demo

# -------------------------------------------------------------------------
# Configura?ia Bazei de Date MySQL
# -------------------------------------------------------------------------

# 1. Conexiunea la baza de date (URL, utilizator, parol?)
# ATEN?IE: Schimba?i 'user' ?i 'password' cu creden?ialele MySQL locale.
# 'library_db' este numele bazei de date care va fi creat?.
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configura?ia JPA (Hibernate)
# ddl-auto=update: Permite Hibernate s? creeze automat tabelele
# în baza de date pe baza entit??ilor Java (@Entity).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true